<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ebyan — Create New Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf3eb;font-family:Arial,sans-serif;color:#152019}.box{width:min(420px,90vw);background:#fff;border:1px solid #d9e4d8;border-radius:22px;padding:32px;box-shadow:0 25px 70px rgba(20,45,24,.12);text-align:center}.logo{width:110px;height:65px;object-fit:contain}.box h1{font:400 34px Georgia,serif;margin:8px 0}.box p{font-size:11px;color:#69746b;line-height:1.6}.field{width:100%;box-sizing:border-box;border:1px solid #d7e2d6;border-radius:10px;padding:13px;margin:6px 0;font-size:12px}.btn{width:100%;border:0;background:#174b27;color:#fff;border-radius:10px;padding:13px;font-weight:800;margin-top:8px;cursor:pointer}.msg{min-height:18px;margin-top:10px;font-size:10px}.back{display:block;margin-top:13px;color:#2f7140;font-size:10px}</style></head><body><main class="box"><img class="logo" src="assets/site-logo.jpeg"><h1>Create new password</h1><p>Choose a new password for your Ebyan account.</p><input class="field" id="p1" type="password" placeholder="New password"><input class="field" id="p2" type="password" placeholder="Confirm new password"><button class="btn" id="save">UPDATE PASSWORD</button><div class="msg" id="msg"></div><a class="back" href="index.html">Back to Ebyan sign in</a></main><script>const sb=supabase.createClient('https://ygcoolohknjfcxmcwbsm.supabase.co','sb_publishable_Zmog-FAbrdz6cxjW-NtxJQ_B4q_Dzgb');const m=document.getElementById('msg');sb.auth.onAuthStateChange((e,s)=>{if(e==='PASSWORD_RECOVERY')m.textContent='Reset link accepted. Create your new password.'});document.getElementById('save').onclick=async()=>{let a=p1.value,b=p2.value;if(a.length<6)return m.textContent='Password must be at least 6 characters.';if(a!==b)return m.textContent='The passwords do not match.';let r=await sb.auth.updateUser({password:a});if(r.error)return m.textContent=r.error.message;m.textContent='Password updated successfully. You can now sign in.';setTimeout(()=>location.href='index.html',1200)};</script><!-- EBYAN RECEIPT LINK --><a href="receipt.html" class="ebyan-receipt-link ebyan-receipt-mini" style="display:inline-block;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:800;background:#174d3a;color:#fff">View / Print Receipt</a></body></html>
