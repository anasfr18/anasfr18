<title>Ebyan Order Receipt</title>
<style>
body{margin:0;background:#f5f7f5;color:#17382d;font-family:Inter,system-ui,Arial;padding:24px}
.wrap{max-width:600px;margin:auto}.receipt{background:#fff;border:1px solid #dfe8e2;border-radius:15px;padding:18px;box-shadow:0 15px 50px #17352b12}
header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #e3e9e4;padding-bottom:18px}h1{margin:0;font-size:21px}.muted{color:#718078;font-size:13px}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0}.items{margin:20px 0;border-top:1px solid #e3e9e4;border-bottom:1px solid #e3e9e4}.total{font-size:16px;font-weight:900}.status{display:inline-block;padding:7px 10px;border-radius:99px;background:#eaf4ee;color:#174d3a;font-weight:800;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:11px;padding:8px 11px;font-weight:800;cursor:pointer;background:#174d3a;color:white}.soft{background:#eaf3ed;color:#174d3a}@media print{body{padding:0;background:#fff}.actions{display:none}.receipt{box-shadow:none;border:0}}

<style id="ebyan-everything-animation">
/* Ebyan motion system — consistent across every page and interaction */
:root{--ebyan-ease:cubic-bezier(.2,.8,.2,1)}
html{scroll-behavior:smooth}
body{animation:ebyanPageIn .45s var(--ebyan-ease) both}
@keyframes ebyanPageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button,.btn,a,input,select,textarea,.card,.panel,.order,.item,.feature,.benefit-bridge,.modal,.drawer,.ai-btn{transition:transform .22s var(--ebyan-ease),box-shadow .22s var(--ebyan-ease),opacity .22s ease,border-color .22s ease,background-color .22s ease}
button:not(:disabled):hover,.btn:not(:disabled):hover{transform:translateY(-2px)}
button:not(:disabled):active,.btn:not(:disabled):active{transform:translateY(0) scale(.97)}
.card:hover,.panel:hover,.order:hover,.item:hover,.feature:hover{transform:translateY(-3px);box-shadow:0 16px 42px rgba(23,77,58,.10)}
input:focus,select:focus,textarea:focus{transform:translateY(-1px);box-shadow:0 0 0 3px rgba(23,77,58,.10)}
.ebyan-ripple{position:absolute;border-radius:999px;pointer-events:none;background:rgba(255,255,255,.38);transform:scale(0);animation:ebyanRipple .55s ease-out forwards}
@keyframes ebyanRipple{to{transform:scale(4);opacity:0}}
.ebyan-press{animation:ebyanPress .28s ease both}
@keyframes ebyanPress{50%{transform:scale(.96)}100%{transform:none}}
.ebyan-reveal{animation:ebyanReveal .55s var(--ebyan-ease) both}
@keyframes ebyanReveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ebyan-loading{position:relative;pointer-events:none;opacity:.72}
.ebyan-loading:after{content:"";width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;margin-left:8px;vertical-align:-2px;animation:ebyanSpin .65s linear infinite}
@keyframes ebyanSpin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

<body><div class="wrap"><div class="receipt">
<header><div><div class="muted">EBYAN COSMETICS</div><h1>Order Receipt</h1></div><div style="text-align:right"><div id="orderNo" class="muted"></div><div id="status" class="status"></div></div></header>
<div style="margin-top:18px"><div class="row"><span class="muted">Customer</span><b id="customer"></b></div><div class="row"><span class="muted">Phone</span><b id="phone"></b></div><div class="row"><span class="muted">Delivery</span><b id="address"></b></div><div class="row"><span class="muted">Date</span><b id="date"></b></div><div class="row"><span class="muted">Payment</span><b id="payment"></b></div></div>
<div class="items"><div id="items"></div></div>
<div><div class="row"><span>Subtotal</span><b id="subtotal"></b></div><div class="row"><span>Delivery</span><b id="delivery"></b></div><div class="row total"><span>Total</span><span id="total"></span></div></div>
<div id="note" class="muted" style="margin-top:18px"></div>
<div class="actions"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn soft" onclick="location.href='index.html'">Continue Shopping</button></div>
</div></div>
<script>
const o=JSON.parse(localStorage.getItem('ebyan_last_order')||'null');
if(!o){document.body.innerHTML='<div class="wrap"><div class="receipt"><h1>No receipt found</h1><p class="muted">Place an order first.</p></div></div>'}
else{
const money=n=>'KSh '+Number(n||0).toLocaleString();
document.getElementById('orderNo').textContent=o.orderNumber||('EBY-'+Date.now());
document.getElementById('status').textContent=o.status==='paid'?'CONFIRMED / PAID':o.status==='confirmed'?'ORDER CONFIRMED':'PAYMENT PENDING VERIFICATION';
document.getElementById('customer').textContent=o.customerName||'-';document.getElementById('phone').textContent=o.phone||'-';document.getElementById('address').textContent=o.address||'-';document.getElementById('date').textContent=o.date?new Date(o.date).toLocaleString():new Date().toLocaleString();document.getElementById('payment').textContent=o.paymentMethod||'-';
const list=Array.isArray(o.items)?o.items:[];document.getElementById('items').innerHTML=list.map(i=>`<div class="row"><span>${String(i.name||'Soap')} × ${Number(i.quantity||1)}</span><b>${money((Number(i.price)||400)*(Number(i.quantity)||1))}</b></div>`).join('');
document.getElementById('subtotal').textContent=money(o.subtotal);document.getElementById('delivery').textContent=money(o.delivery);document.getElementById('total').textContent=money(o.total);
document.getElementById('note').textContent=o.paymentMethod==='Pay on Delivery'?'Your order is confirmed. Payment will be made on delivery.':o.status==='paid'?'Your M-Pesa payment has been verified.':'Your M-Pesa screenshot has been received and is awaiting verification.';
}
</script><script id="ebyan-everything-animation-runtime">
(function(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function ripple(el,e){if(reduce||!el||el.disabled)return; if(getComputedStyle(el).position==='static')el.style.position='relative'; if(getComputedStyle(el).overflow==='visible')el.style.overflow='hidden'; const r=document.createElement('span');r.className='ebyan-ripple';const rect=el.getBoundingClientRect();const size=Math.max(rect.width,rect.height)*.55;r.style.width=r.style.height=size+'px';r.style.left=(e.clientX-rect.left-size/2)+'px';r.style.top=(e.clientY-rect.top-size/2)+'px';el.appendChild(r);setTimeout(()=>r.remove(),600)}
  function bind(root=document){root.querySelectorAll('button,a,.btn').forEach(el=>{if(el.dataset.ebyanMotion)return;el.dataset.ebyanMotion='1';el.addEventListener('pointerdown',e=>ripple(el,e));el.addEventListener('click',()=>{if(!reduce){el.classList.remove('ebyan-press');void el.offsetWidth;el.classList.add('ebyan-press');}})});}
  function reveal(){document.querySelectorAll('.card,.feature,.panel,.order,.item,.benefit-bridge').forEach((el,i)=>{if(el.dataset.ebyanReveal)return;el.dataset.ebyanReveal='1';el.style.animationDelay=Math.min(i*.035,.35)+'s';el.classList.add('ebyan-reveal')})}
  bind();reveal();new MutationObserver(m=>{if(m.some(x=>x.addedNodes.length)){bind();reveal()}}).observe(document.body,{subtree:true,childList:true});
})();
</script></body></html>
