<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ebyan Order Receipt</title>
<style>
body{margin:0;background:#f5f7f5;color:#17382d;font-family:Inter,system-ui,Arial;padding:24px}
.wrap{max-width:600px;margin:auto}.receipt{background:#fff;border:1px solid #dfe8e2;border-radius:15px;padding:18px;box-shadow:0 15px 50px #17352b12}
header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #e3e9e4;padding-bottom:18px}h1{margin:0;font-size:21px}.muted{color:#718078;font-size:13px}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0}.items{margin:20px 0;border-top:1px solid #e3e9e4;border-bottom:1px solid #e3e9e4}.total{font-size:16px;font-weight:900}.status{display:inline-block;padding:7px 10px;border-radius:99px;background:#eaf4ee;color:#174d3a;font-weight:800;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:11px;padding:8px 11px;font-weight:800;cursor:pointer;background:#174d3a;color:white}.soft{background:#eaf3ed;color:#174d3a}@media print{body{padding:0;background:#fff}.actions{display:none}.receipt{box-shadow:none;border:0}}
</style>

<style id="ebyan-receipt-compact">
body{padding:10px!important;background:#f7f9f7!important}
.wrap{max-width:390px!important;margin:8px auto!important}
.receipt{padding:14px!important;border-radius:13px!important;box-shadow:0 8px 28px rgba(23,56,45,.08)!important}
.receipt header{padding-bottom:10px!important}
.receipt h1{font-size:17px!important;letter-spacing:-.2px!important}
.receipt .muted{font-size:10px!important}
.receipt .row{padding:5px 0!important;font-size:11px!important}
.receipt .total{font-size:14px!important}
.receipt .status{padding:4px 7px!important;font-size:9px!important}
.receipt .actions{margin-top:12px!important;gap:6px!important}
.receipt .btn{padding:7px 9px!important;border-radius:8px!important;font-size:10px!important}
.receipt .items{margin:10px 0!important}
.receipt #note{margin-top:10px!important;font-size:10px!important}
</style>
<style id="ebyan-everything-animation">
/* Ebyan motion system — consistent across every page and interaction */
:root{--ebyan-ease:cubic-bezier(.2,.8,.2,1)}
html{scroll-behavior:smooth}
body{animation:ebyanPageIn .45s var(--ebyan-ease) both}
@keyframes ebyanPageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button,.btn,a,input,select,textarea,.card,.panel,.order,.item,.feature,.benefit-bridge,.modal,.drawer,.ai-btn{transition:transform .22s var(--ebyan-ease),box-shadow .22s var(--ebyan-ease),opacity .22s ease,border-color .22s ease,background-color .22s ease}
button:not(:disabled):hover,.btn:not(:disabled):hover{transform:translateY(-2px)}
button:not(:disabled):active,.btn:not(:disabled):active{transform:translateY(0) scale(.97)}
.card:hover,.panel:hover,.order:hover,.item:hover,.feature:hover{transform:translateY(-3px);box-shadow:0 16px 42px rgba(23,77,58,.10)}
input:focus,select:focus,textarea:focus{transform:translateY(-1px);box-shadow:0 0 0 3px rgba(23,77,58,.10)}
.ebyan-ripple{position:absolute;border-radius:999px;pointer-events:none;background:rgba(255,255,255,.38);transform:scale(0);animation:ebyanRipple .55s ease-out forwards}
@keyframes ebyanRipple{to{transform:scale(4);opacity:0}}
.ebyan-press{animation:ebyanPress .28s ease both}
@keyframes ebyanPress{50%{transform:scale(.96)}100%{transform:none}}
.ebyan-reveal{animation:ebyanReveal .55s var(--ebyan-ease) both}
@keyframes ebyanReveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ebyan-loading{position:relative;pointer-events:none;opacity:.72}
.ebyan-loading:after{content:"";width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;margin-left:8px;vertical-align:-2px;animation:ebyanSpin .65s linear infinite}
@keyframes ebyanSpin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style><link rel="icon" type="image/png" href="assets/ebyan-real-logo.png"><link rel="apple-touch-icon" href="assets/ebyan-real-logo.png"></head>
<body><div class="wrap"><div class="receipt">
<header><div><div class="muted">EBYAN COSMETICS</div><h1>Order Receipt</h1></div><div style="text-align:right"><div id="orderNo" class="muted"></div><div id="status" class="status"></div></div></header>
<div style="margin-top:18px"><div class="row"><span class="muted">Customer</span><b id="customer"></b></div><div class="row"><span class="muted">Phone</span><b id="phone"></b></div><div class="row"><span class="muted">Delivery</span><b id="address"></b></div><div class="row"><span class="muted">Date</span><b id="date"></b></div><div class="row"><span class="muted">Payment</span><b id="payment"></b></div></div>
<div class="items"><div id="items"></div></div>
<div><div class="row"><span>Subtotal</span><b id="subtotal"></b></div><div class="row"><span>Delivery</span><b id="delivery"></b></div><div class="row total"><span>Total</span><span id="total"></span></div></div>
<div id="note" class="muted" style="margin-top:18px"></div>
<div class="actions"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn soft" onclick="location.href='index.html'">Continue Shopping</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ygcoolohknjfcxmcwbsm.supabase.co';
const SUPABASE_KEY='sb_publishable_Zmog-FAbrdz6cxjW-NtxJQ_B4q_Dzgb';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const money=n=>'KSh '+Number(n||0).toLocaleString('en-KE');
const esc=x=>String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const root=document.querySelector('.wrap');
function showError(text){root.innerHTML=`<div class="receipt"><h1>${esc(text)}</h1><p class="muted">Sign in and place an order to view your customer receipts.</p><div class="actions"><button class="btn" onclick="location.href='index.html'">Back to Ebyan</button></div></div>`}
function renderReceipt(o,items){
 const list=Array.isArray(items)?items:[];
 root.innerHTML=`<div class="receipt">
 <header><div><div class="muted">EBYAN COSMETICS</div><h1>Order Receipt</h1></div><div style="text-align:right"><div class="muted">${esc(o.order_number||o.id)}</div><div class="status">${esc(String(o.status||'pending').replaceAll('_',' ').toUpperCase())}</div></div></header>
 <div style="margin-top:18px"><div class="row"><span class="muted">Customer</span><b>${esc(o.customer_name||'-')}</b></div><div class="row"><span class="muted">Phone</span><b>${esc(o.customer_phone||o.checkout_phone||'-')}</b></div><div class="row"><span class="muted">Delivery</span><b>${esc((o.delivery_address||'-')+(o.town_area?', '+o.town_area:''))}</b></div><div class="row"><span class="muted">Date</span><b>${o.created_at?new Date(o.created_at).toLocaleString():'-'}</b></div><div class="row"><span class="muted">Payment</span><b>${esc(o.payment_method||'-')}</b></div></div>
 <div class="items">${list.map(i=>`<div class="row"><span>${esc(i.product_name||i.name||'Soap')} × ${Number(i.quantity||1)}</span><b>${money(Number(i.unit_price||i.price||0)*Number(i.quantity||1))}</b></div>`).join('')||'<div class="row"><span>No item details available</span></div>'}</div>
 <div><div class="row"><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div class="row"><span>Delivery</span><b>${money(o.delivery_fee)}</b></div><div class="row total"><span>Total</span><span>${money(o.total)}</span></div></div>
 <div id="note" class="muted" style="margin-top:18px">${o.payment_method==='cash_on_delivery'?'Your order is confirmed. Payment will be made on delivery.':o.payment_status==='paid'?'Your M-Pesa payment has been verified.':'Your payment proof is awaiting verification.'}</div>
 <div class="actions"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn soft" onclick="location.href='receipt.html'">All Receipts</button><button class="btn soft" onclick="location.href='index.html'">Continue Shopping</button></div>
 </div>`;
}
function renderList(orders){
 root.innerHTML=`<div class="receipt"><header><div><div class="muted">EBYAN COSMETICS</div><h1>Your Receipts</h1></div><div class="status">${orders.length} ORDER${orders.length===1?'':'S'}</div></header><p class="muted" style="margin:14px 0 18px">Your previous Ebyan orders and printable receipts.</p>${orders.map(o=>`<div class="row" style="border-bottom:1px solid #e3e9e4;align-items:center"><div><b>${esc(o.order_number||o.id)}</b><div class="muted">${o.created_at?new Date(o.created_at).toLocaleString():''} · ${money(o.total)}</div></div><button class="btn" data-view="${o.id}">View Receipt</button></div>`).join('')||'<p class="muted">No receipts yet. Place your first order to see it here.</p>'}<div class="actions"><button class="btn soft" onclick="location.href='index.html'">Continue Shopping</button></div></div>`;
 root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>location.href='receipt.html?order='+encodeURIComponent(b.dataset.view));
}
async function load(){
 const local=JSON.parse(localStorage.getItem('ebyan_last_order')||'null');
 const {data:{session}}=await sb.auth.getSession();
 if(!session){if(local){renderReceipt({id:local.orderId,order_number:local.orderNumber,customer_name:local.customerName,customer_phone:local.phone,delivery_address:local.address,created_at:local.date,payment_method:local.paymentMethod,status:local.status,subtotal:local.subtotal,delivery_fee:local.delivery,total:local.total},local.items)}else showError('No receipt found');return}
 const orderId=new URLSearchParams(location.search).get('order');
 if(orderId){
  const {data:o,error}=await sb.from('orders').select('*').eq('id',orderId).eq('user_id',session.user.id).maybeSingle();
  if(error||!o)return showError('Receipt not found');
  const {data:items}=await sb.from('order_items').select('*').eq('order_id',o.id);
  renderReceipt(o,items||[]);return;
 }
 const {data:orders,error}=await sb.from('orders').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false});
 if(error)return showError('Could not load receipts');
 renderList(orders||[]);
}
load();
</script><script id="ebyan-everything-animation-runtime">
(function(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function ripple(el,e){if(reduce||!el||el.disabled)return; if(getComputedStyle(el).position==='static')el.style.position='relative'; if(getComputedStyle(el).overflow==='visible')el.style.overflow='hidden'; const r=document.createElement('span');r.className='ebyan-ripple';const rect=el.getBoundingClientRect();const size=Math.max(rect.width,rect.height)*.55;r.style.width=r.style.height=size+'px';r.style.left=(e.clientX-rect.left-size/2)+'px';r.style.top=(e.clientY-rect.top-size/2)+'px';el.appendChild(r);setTimeout(()=>r.remove(),600)}
  function bind(root=document){root.querySelectorAll('button,a,.btn').forEach(el=>{if(el.dataset.ebyanMotion)return;el.dataset.ebyanMotion='1';el.addEventListener('pointerdown',e=>ripple(el,e));el.addEventListener('click',()=>{if(!reduce){el.classList.remove('ebyan-press');void el.offsetWidth;el.classList.add('ebyan-press');}})});}
  function reveal(){document.querySelectorAll('.card,.feature,.panel,.order,.item,.benefit-bridge').forEach((el,i)=>{if(el.dataset.ebyanReveal)return;el.dataset.ebyanReveal='1';el.style.animationDelay=Math.min(i*.035,.35)+'s';el.classList.add('ebyan-reveal')})}
  bind();reveal();new MutationObserver(m=>{if(m.some(x=>x.addedNodes.length)){bind();reveal()}}).observe(document.body,{subtree:true,childList:true});
})();
</script></body></html>
