<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ebyan Visual Website Editor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f3f6f4;color:#17382d}button,input,textarea,select{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf5ef,#fff)}.loginbox{width:min(440px,100%);background:#fff;padding:32px;border-radius:24px;border:1px solid #dce7df;box-shadow:0 20px 70px #17352b18}.center{text-align:center}.muted{color:#708078;font-size:13px}label{display:block;font-size:12px;font-weight:800;margin:15px 0 6px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #d8e3dc;border-radius:10px;background:#fff;color:#17382d}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#174d3a;color:#fff}.soft{background:#eaf3ed;color:#174d3a}.danger{background:#fff0f0;color:#a02d2d}
.app{display:none}.side{position:fixed;left:0;top:0;bottom:0;width:255px;background:#174d3a;color:white;padding:18px}.logo{font-weight:900;font-size:19px;padding:12px;margin-bottom:12px}.nav button{width:100%;display:block;text-align:left;border:0;background:transparent;color:#dcebe3;padding:12px;border-radius:10px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff18;color:white}.main{margin-left:255px;padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:3px 0;font-size:27px}.panel{background:#fff;border:1px solid #dfe8e2;border-radius:18px;padding:18px}.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}.preview{height:790px;border:1px solid #dfe8e2;border-radius:18px;overflow:hidden;background:white}.preview iframe{width:100%;height:100%;border:0}.field{margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.notice{background:#eef6f0;color:#28533f;padding:11px 13px;border-radius:10px;font-size:13px}.item{border:1px solid #e1e9e4;border-radius:11px;padding:11px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.itemmain{flex:1;min-width:0}.thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#eef2ee}.small{font-size:11px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
@media(max-width:950px){.side{position:static;width:100%;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{margin-left:0;padding:15px}.grid{grid-template-columns:1fr}.preview{height:650px}}
</style>

<style id="ebyan-cart-benefit-style">
.ebyan-cart-benefit-btn{display:block!important;width:100%!important;margin:10px 0 0!important;padding:10px 14px!important;border:1px solid currentColor!important;border-radius:10px!important;text-align:center!important;text-decoration:none!important;font-weight:800!important;cursor:pointer!important;box-sizing:border-box!important}
</style>

<style id="ebyan-cart-benefits-upgrade">
.ebyan-explore-benefits{
 display:flex!important;align-items:center!important;justify-content:space-between!important;
 gap:12px!important;margin:10px 0 14px!important;padding:9px 12px!important;
 border:1px solid rgba(23,77,58,.18)!important;border-radius:12px!important;
 background:linear-gradient(135deg,#f7fbf8,#edf6f0)!important;
 box-sizing:border-box!important;
}
.ebyan-explore-benefits .ebyan-explore-copy{font-size:12px!important;line-height:1.25!important;color:#587064!important}
.ebyan-explore-benefits .ebyan-explore-btn{
 flex:0 0 auto!important;padding:8px 11px!important;border-radius:9px!important;
 background:#174d3a!important;color:#fff!important;text-decoration:none!important;
 font-size:11px!important;font-weight:850!important;letter-spacing:.2px!important;
}
.ebyan-receipt-mini{font-size:11px!important;padding:5px 9px!important;border-radius:8px!important}
</style>
</head>
<body>
<section id="login" class="login"><div class="loginbox"><div class="center"><div style="font-size:42px">🌿</div><h2>Ebyan Visual Admin</h2><div class="muted">Edit your customer website</div></div><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="btn primary" id="loginBtn" style="width:100%;margin-top:18px">Sign In</button><div id="msg" class="muted" style="margin-top:12px"></div></div></section>
<section id="app" class="app">
<aside class="side"><div class="logo">🌿 Ebyan Visual Admin</div><div class="nav">
<button data-v="overview">Overview</button><button data-v="visual">Visual Editor</button><button data-v="text">Text</button><button data-v="images">Images</button><button data-v="buttons">Buttons</button><button data-v="products">Products</button><button data-v="pages">Pages</button><button data-v="design">Design</button><button data-v="cart">Cart</button><button data-v="ai">Ask Ebyan</button><button data-v="preview">Preview</button><button data-v="settings">Settings</button><button id="logout">Log Out</button>
</div></aside>
<main class="main"><div class="top"><div><div class="muted">Complete storefront control</div><h1 id="title">Overview</h1></div><a class="btn soft" href="index.html" target="_blank">Open Store</a></div><div id="content"></div></main>
</section>
<script>
/* SECURITY: use only Supabase public URL + publishable/anon key here, never service-role keys. */
const SUPABASE_URL=window.EBYAN_SUPABASE_URL||'';const SUPABASE_ANON_KEY=window.EBYAN_SUPABASE_ANON_KEY||'';
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const D={heroTitle:'Natural care, handmade for you.',heroText:'Discover Ebyan natural soaps, crafted with care from beautiful ingredients.',aboutTitle:'About Ebyan',aboutText:'Handmade natural care created with beautiful ingredients and thoughtful craftsmanship.',contactTitle:'Contact Us',aiTitle:'Ask Ebyan',aiGreeting:'Hi! I’m Ask Ebyan. How can I help you today?',benefitsTitle:'Explore Soap Benefits',benefitsButton:'Explore More Benefits',productsTitle:'Our Products'};
let state=JSON.parse(localStorage.getItem('ebyan_visual_cms')||'null')||{copy:{...D},design:{font:'system',radius:14,spacing:'comfortable',theme:'natural'},buttons:{},products:[
{name:'Aloe Vera',price:400,image:'aloe.jpg',active:true},{name:'Honey',price:400,image:'honey.jpg',active:true},{name:'Papaya',price:400,image:'papaya.jpg',active:true},{name:'Black Seed',price:400,image:'blackseed.jpg',active:true},{name:'Lemon',price:400,image:'lemon.jpg',active:true},{name:'Cucumber',price:400,image:'cucumber.jpg',active:true}],pages:[{title:'Explore Soap Benefits',slug:'soap-benefits.html',published:true}]};
function save(){localStorage.setItem('ebyan_visual_cms',JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const login=document.getElementById('login'),app=document.getElementById('app'),title=document.getElementById('title'),content=document.getElementById('content');
function go(v){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));title.textContent=({overview:'Overview',visual:'Visual Editor',text:'Text',images:'Images',buttons:'Buttons',products:'Products',pages:'Pages',design:'Design',cart:'Cart',ai:'Ask Ebyan',preview:'Customer Preview',settings:'Settings'})[v];({overview,visual,textEditor,images,buttons,products,pages,design,cart,ai,preview,settings})[v]()}
function overview(){content.innerHTML=`<div class="grid"><div class="panel"><h3>Everything you can control</h3><p class="muted">Use the editor to manage text, images, buttons, products, pages, design, cart behavior and Ask Ebyan. Preview the customer site beside your controls.</p><div class="row"><button class="btn primary" onclick="go('visual')">Open Visual Editor</button><button class="btn soft" onclick="go('preview')">Customer View</button></div></div><div class="panel"><h3>Store</h3><div class="item"><span>Products</span><b>${state.products.length}</b></div><div class="item"><span>Default soap price</span><b>KSh 400</b></div><div class="item"><span>Pages</span><b>${state.pages.length}</b></div></div></div>`}
function visual(){content.innerHTML=`<div class="grid"><div class="panel"><h3>Visual controls</h3><div class="notice">This is the control center. Select a category below to edit that part of the storefront.</div><div class="tabs" style="margin-top:14px">${[['text','Text'],['images','Images'],['buttons','Buttons'],['products','Products'],['pages','Pages'],['design','Design'],['cart','Cart'],['ai','Ask Ebyan']].map(x=>`<button class="btn soft" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div><p class="muted">For true point-and-click editing of arbitrary elements, the storefront itself must expose editable element IDs/blocks. This package provides the universal controls and a customer preview.</p></div><div class="preview"><iframe src="index.html" title="Customer website"></iframe></div></div>`}
function textEditor(){content.innerHTML=`<div class="panel"><h3>Every main text field</h3>${Object.keys(D).map(k=>`<div class="field"><label>${k}</label>${k.includes('Text')||k==='aiGreeting'?`<textarea id="t_${k}">${esc(state.copy[k])}</textarea>`:`<input id="t_${k}" value="${esc(state.copy[k])}">`}</div>`).join('')}<button class="btn primary" onclick="saveText()">Save Text</button></div>`}
function saveText(){Object.keys(D).forEach(k=>{const e=document.getElementById('t_'+k);if(e)state.copy[k]=e.value});save();alert('Text draft saved.')}
function images(){content.innerHTML=`<div class="panel"><h3>Website Images</h3><div class="notice">Choose replacement images and preview them. Files are stored as browser drafts in this version; connect Supabase Storage for global publishing.</div>${['hero','logo','about','ai'].map(k=>`<div class="field"><label>${k} image</label><input type="file" accept="image/*" data-image="${k}">${state.images&&state.images[k]?`<div style="margin-top:8px"><img src="${state.images[k]}" style="max-width:180px;max-height:100px;border-radius:10px"></div>`:''}</div>`).join('')}<button class="btn primary" onclick="save();alert('Image drafts saved.')">Save Images</button></div>`;if(!state.images)state.images={};document.querySelectorAll('[data-image]').forEach(e=>e.onchange=()=>{const f=e.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.images[e.dataset.image]=r.result;save();images()};r.readAsDataURL(f)})}
function buttons(){const b=state.buttons;content.innerHTML=`<div class="panel"><h3>Buttons & links</h3>${['shop','benefits','contact','addToCart','exploreBenefits','account','checkout'].map(k=>{let x=b[k]||{text:k==='benefits'||k==='exploreBenefits'?'Explore More Benefits':k.replace(/([A-Z])/g,' $1'),url:'#',visible:true};b[k]=x;return `<div class="item"><div class="itemmain"><b>${esc(x.text)}</b><div class="muted small">${esc(x.url)}</div></div><button class="btn soft" onclick="editButton('${k}')">Edit</button></div>`}).join('')}</div>`}
function editButton(k){const x=state.buttons[k];let t=prompt('Button text',x.text);if(t===null)return;let u=prompt('Destination URL',x.url);if(u===null)return;x.text=t;x.url=u;save();buttons()}
function products(){content.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>Products</h3><button class="btn primary" onclick="addProduct()">Add Product</button></div>${state.products.map((p,i)=>`<div class="item"><div class="itemmain"><b>${esc(p.name)}</b><div class="muted">KSh ${p.price} · ${p.active?'Visible':'Hidden'}</div></div><button class="btn soft" onclick="editProduct(${i})">Edit</button><button class="btn danger" onclick="removeProduct(${i})">Remove</button></div>`).join('')}</div>`}
function addProduct(){let n=prompt('Product name');if(!n)return;state.products.push({name:n,price:400,image:'',active:true});save();products()}
function editProduct(i){let p=state.products[i];let n=prompt('Name',p.name);if(n!==null)p.name=n;let price=prompt('Price in KSh',p.price);if(price!==null)p.price=Math.max(0,Number(price)||0);let img=prompt('Image path or URL',p.image);if(img!==null)p.image=img;p.active=confirm('Visible to customers?');save();products()}
function removeProduct(i){if(confirm('Remove product?')){state.products.splice(i,1);save();products()}}
function pages(){content.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>Pages</h3><button class="btn primary" onclick="addPage()">Create New Page</button></div>${state.pages.map((p,i)=>`<div class="item"><div class="itemmain"><b>${esc(p.title)}</b><div class="muted">${esc(p.slug)} · ${p.published?'Published':'Draft'}</div></div><button class="btn soft" onclick="editPage(${i})">Edit</button><button class="btn danger" onclick="deletePage(${i})">Delete</button></div>`).join('')}</div>`}
function addPage(){let t=prompt('Page title');if(!t)return;let s=prompt('Page filename','new-page.html');if(!s)return;state.pages.push({title:t,slug:s,published:true});save();pages()}
function editPage(i){let p=state.pages[i];let t=prompt('Title',p.title);if(t!==null)p.title=t;let s=prompt('Filename',p.slug);if(s!==null)p.slug=s;p.published=confirm('Published?');save();pages()}
function deletePage(i){if(confirm('Delete page record?')){state.pages.splice(i,1);save();pages()}}
function design(){content.innerHTML=`<div class="panel"><h3>Visual design</h3><div class="field"><label>Font</label><select id="font"><option>system</option><option>serif</option><option>sans</option></select></div><div class="field"><label>Corner radius</label><select id="radius"><option value="8">Small</option><option value="14">Medium</option><option value="22">Large</option></select></div><div class="field"><label>Spacing</label><select id="spacing"><option>compact</option><option>comfortable</option><option>airy</option></select></div><div class="field"><label>Theme</label><select id="theme"><option>natural</option><option>minimal</option><option>luxury</option></select></div><button class="btn primary" onclick="state.design={font:font.value,radius:Number(radius.value),spacing:spacing.value,theme:theme.value};save();alert('Design draft saved.')">Save Design</button></div>`;font.value=state.design.font;radius.value=state.design.radius;spacing.value=state.design.spacing;theme.value=state.design.theme}
function cart(){content.innerHTML=`<div class="grid"><div class="panel"><h3>Cart</h3><div class="item"><span>Explore More Benefits for every soap</span><b>ON</b></div><div class="item"><span>Add to Cart</span><b>ON</b></div><div class="item"><span>Quantity controls</span><b>ON</b></div><div class="item"><span>Soap price</span><b>KSh 400</b></div><div class="field"><label>Delivery note</label><textarea id="delivery">Delivery calculated at checkout.</textarea></div><button class="btn primary" onclick="save();alert('Cart draft saved.')">Save Cart</button></div><div class="preview"><iframe src="index.html" title="Cart preview"></iframe></div></div>`}
function ai(){content.innerHTML=`<div class="panel"><h3>Ask Ebyan</h3><div class="field"><label>Assistant name</label><input id="ait" value="${esc(state.copy.aiTitle)}"></div><div class="field"><label>Opening message</label><textarea id="aig">${esc(state.copy.aiGreeting)}</textarea></div><div class="notice">Use this area to keep the visible AI assistant text consistent with the Ebyan brand.</div><button class="btn primary" onclick="state.copy.aiTitle=ait.value;state.copy.aiGreeting=aig.value;save();alert('Ask Ebyan draft saved.')">Save</button></div>`}
function preview(){content.innerHTML=`<div class="preview" style="height:820px"><iframe src="index.html" title="Customer website preview"></iframe></div>`}
function settings(){content.innerHTML=`<div class="panel"><h3>Publishing & security</h3><div class="notice">The admin uses Supabase Auth. Production global editing requires Supabase database/Storage + Row Level Security. Never put a service-role key in frontend code.</div><p class="muted">Local drafts in this build are browser-specific. The included SUPABASE-CMS-SETUP.sql describes the secure shared CMS tables.</p><button class="btn danger" onclick="if(confirm('Clear local editor drafts?')){localStorage.removeItem('ebyan_visual_cms');location.reload()}">Clear Drafts</button></div>`}
function openApp(){login.style.display='none';app.style.display='block';go('overview')}
async function doLogin(){if(!sb){msg.textContent='Configure the Supabase public URL and publishable/anon key in this admin file first.';return}msg.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent=error.message;return}openApp()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));loginBtn.onclick=doLogin;password.onkeydown=e=>{if(e.key==='Enter')doLogin()};logout.onclick=async()=>{if(sb)await sb.auth.signOut();location.reload()};if(sb)sb.auth.getSession().then(({data})=>{if(data.session)openApp()});
</script>
</body></html>
