ard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px}.metric small{color:#77827b;font-size:12px}.metric strong{display:block;font-size:24px;margin-top:8px}.notice{background:#edf6f0;border-radius:11px;padding:12px;color:#2b5a43;font-size:12px}.section{margin-top:16px}.section h2{font-size:17px;margin:0 0 12px}.orders{display:grid;gap:10px}.order{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;justify-content:space-between;gap:15px;align-items:center}.order-main{min-width:0}.order-no{font-weight:900}.order-meta{font-size:11px;color:var(--muted);margin-top:4px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:10px;font-weight:800;padding:6px 9px;border-radius:999px;background:#edf6f0;color:#286044}.chip.warn{background:#fff4db;color:#956700}.chip.danger{background:#fff0d9;color:#a06b00}.chip.blue{background:#eaf1ff;color:#315fba}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf1ee;font-size:12px;white-space:nowrap}th{font-size:11px;color:#6d786f;background:#fbfcfb}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;padding:45px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#0d241a66;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modalback.open{display:flex}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;position:relative;box-shadow:0 30px 90px #0b281a40}.close{position:absolute;right:12px;top:9px;border:0;background:none;font-size:26px;color:#65726b}.toast{position:fixed;right:20px;bottom:20px;background:#17382d;color:#fff;padding:12px 16px;border-radius:11px;opacity:0;transform:translateY(10px);transition:.22s;z-index:80}.toast.show{opacity:1;transform:none}.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:900px){.side{position:static;width:100%;padding:10px}.logo{padding:7px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.main{margin:0;padding:14px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.order{align-items:flex-start;flex-direction:column}.top{align-items:flex-start}.top .btn{display:none}}@media(max-width:520px){.cards{grid-template-columns:1fr}.main{padding-bottom:30px}.card{border-radius:14px}}
</style></head><body>
<section id="login"><form class="loginbox" id="loginForm" novalidate><img src="ebyan-real-logo.png" alt="Ebyan" style="width:86px;height:86px;object-fit:contain;display:block;margin:0 auto 8px"><div style="font-size:36px">🌿</div><h1>Ebyan Admin</h1><div class="muted">Ebyan Cosmetics · Admin only</div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn" style="width:100%">Sign In</button><button class="btn ghost" id="resetBtn" style="width:100%;margin-top:8px">Forgot password?</button><p id="loginMsg" class="muted"></p></form></section>
<section id="app" class="app"><aside class="side"><div class="logo">🌿 Ebyan Admin</div><nav class="nav"><button data-page="dashboard" class="active"><span class="ico">⌂</span>Dashboard</button><button data-page="orders"><span class="ico">▣</span>Orders</button><button data-page="products"><span class="ico">◆</span>Products</button><button data-page="customers"><span class="ico">♙</span>Customers</button><button data-page="proofs"><span class="ico">✓</span>Payment Proofs</button><button data-page="cart"><span class="ico">🛒</span>Cart & Checkout</button><button data-page="settings"><span class="ico">⚙</span>Store Settings</button><button data-page="editor"><span class="ico">✎</span>Website Editing</button><button id="openStore"><span class="ico">↗</span>Open Store</button><button id="logout"><span class="ico">↪</span>Log Out</button></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">Ebyan Cosmetics · Admin only</div><h1 id="pageTitle">Dashboard</h1></div><button class="btn soft" id="refresh">Refresh</button></div><div id="content" class="fade"></div></main></section>

const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlnY29vbG9oa25qZmN4bWN3YnNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTg5NjQsImV4cCI6MjEwMzU5NDk2NH0.osJ600U2O3E_7qLavoFsFSLx1PAJdOUhkXfR9xQF3Qc';
let sb=null, profile=null, current='dashboard', supabaseLoading=null;
const $=id=>document.getElementById(id);
async function ensureSupabase(){
  if(sb) return sb;
  if(supabaseLoading) return supabaseLoading;
  supabaseLoading=(async()=>{
    if(window.supabase?.createClient){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return sb}
    const sources=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2'];
    for(const src of sources){
      try{await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src=src;sc.async=true;sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)});if(window.supabase?.createClient){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return sb}}catch(_){ }
    }
    throw new Error('The secure login service could not be loaded. Please refresh and try again.');
  })();
  try{return await supabaseLoading}finally{supabaseLoading=null}
}

const money=n=>'KSh '+Number(n||0).toLocaleString();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function modal(html){$('modalContent').innerHTML=html;$('modalBack').classList.add('open')}function closeModal(){$('modalBack').classList.remove('open')}$('modalClose').onclick=closeModal;$('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};
async function loadProfile(){
  await ensureSupabase();
  const {data:{user},error:userError}=await sb.auth.getUser();
  if(userError) throw userError;
  if(!user){profile=null;return null}
  const r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(r.error) throw r.error;
  profile=r.data;
  return profile;
}
async function auth(){
  try{
    await ensureSupabase();
    const {data:{session}}=await sb.auth.getSession();
    if(!session){$('login').style.display='grid';return}
    await loadProfile();
    const allowed=['admin','manager'].includes(profile?.role) && profile?.disabled!==true;
    if(allowed) showApp();
    else {await sb.auth.signOut();$('login').style.display='grid';$('loginMsg').textContent='This account is not authorized for Admin access.'}
  }catch(e){
    $('login').style.display='grid';
    $('loginMsg').textContent=e?.message||'Could not load Admin login. Please refresh.';
  }
}
function showApp(){$('login').style.display='none';$('app').style.display='block';go('dashboard')}
async function signIn(){
  const msg=$('loginMsg');
  msg.style.color='var(--muted)';
  msg.textContent='Connecting securely…';
  const btn=$('loginBtn');
  btn.disabled=true; btn.textContent='Signing In…';
  try{
    await ensureSupabase();
    const email=$('email').value.trim().toLowerCase();
    const password=$('password').value;
    if(!email || !password) throw new Error('Enter your email and password.');
    const result=await sb.auth.signInWithPassword({email,password});
    if(result.error) throw result.error;
    if(!result.data?.user) throw new Error('No account session was returned. Please try again.');
    const sessionResult=await sb.auth.getSession();
    if(sessionResult.error) throw sessionResult.error;
    if(!sessionResult.data?.session) throw new Error('Login succeeded but the session could not be saved. Please allow cookies/site storage and try again.');
    const user=result.data.user;
    const pr=await sb.from('profiles').select('id,email,role,disabled').eq('id',user.id).maybeSingle();
    if(pr.error) throw new Error('Signed in, but Admin permission could not be checked: '+pr.error.message);
    if(!pr.data) throw new Error('Signed in, but no Admin profile exists for this account.');
    profile=pr.data;
    const allowed=['admin','manager'].includes(profile.role) && profile.disabled!==true;
    if(!allowed){await sb.auth.signOut();throw new Error('This account is not authorized for Admin access.');}
    msg.textContent='Login successful. Opening Admin…';
    msg.style.color='#286044';
    showApp();
  }catch(err){
    const raw=err?.message||String(err)||'Sign in failed.';
    let text=raw;
    if(/invalid login credentials/i.test(raw)) text='Incorrect email or password.';
    else if(/email not confirmed/i.test(raw)) text='Please confirm the email address before signing in.';
    else if(/too many requests/i.test(raw)) text='Too many attempts. Please wait a moment and try again.';
    msg.textContent=text;
    msg.style.color='#a02d2d';
    console.error('Ebyan Admin sign-in error:',err);
  }finally{
    btn.disabled=false; btn.textContent='Sign In';
  }
}
async function resetPassword(){
  $('loginMsg').textContent='Connecting securely…';
  try{
    await ensureSupabase();
    const e=$('email').value.trim();
    if(!e){$('loginMsg').textContent='Enter your admin email first.';return}
    $('resetBtn').disabled=true;$('resetBtn').textContent='Sending…';
    const redirectTo=new URL('reset-password.html',location.href).href;
    const r=await sb.auth.resetPasswordForEmail(e,{redirectTo});
    if(r.error) throw r.error;
    $('loginMsg').textContent='Password reset email sent. Check your inbox.';$('loginMsg').style.color='#286044';
  }catch(err){$('loginMsg').textContent=err?.message||'Could not send the reset email.';$('loginMsg').style.color='#a02d2d'}
  finally{$('resetBtn').disabled=false;$('resetBtn').textContent='Forgot password?'}
}

function go(p){current=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const titles={dashboard:'Dashboard',orders:'Orders',products:'Products',customers:'Customers',proofs:'Payment Proofs',cart:'Cart & Checkout',settings:'Store Settings',editor:'Website Editing'};$('pageTitle').textContent=titles[p]||p;({dashboard,orders,products,customers,proofs,cart,settings,editor}[p])()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
async function dashboard(){const [o,p,u]=await Promise.all([sb.from('orders').select('id,total,status,created_at,customer_name,customer_phone,town_area,payment_method,order_number').order('created_at',{ascending:false}),sb.from('products').select('id,stock,price'),sb.from('profiles').select('id')]);const orders=o.data||[],products=p.data||[],rev=orders.filter(x=>x.status!=='cancelled').reduce((s,x)=>s+Number(x.total||0),0);$('content').innerHTML=`<div class="cards fade"><div class="card metric"><small>Orders</small><strong>${orders.length}</strong></div><div class="card metric"><small>Payment proofs to review</small><strong>${orders.filter(x=>x.payment_proof_path&&!x.payment_proof_reviewed_at).length}</strong></div><div class="card metric"><small>Confirmed / active</small><strong>${orders.filter(x=>['confirmed','processing','out_for_delivery'].includes(x.status)).length}</strong></div><div class="card metric"><small>Order value</small><strong>${money(rev)}</strong></div></div><div class="card section fade"><div class="notice"><b>Admin control center.</b> Products, prices, images, benefits, customers, orders, payment proofs and cart/checkout settings can be managed here.</div><h2 style="margin-top:22px">Latest orders</h2><div class="orders">${orders.slice(0,8).map(orderCard).join('')||'<div class="empty">No orders yet.</div>'}</div></div>`}
function statusChip(s){const cls=s==='cancelled'?'danger':s==='pending'?'warn':s==='processing'||s==='out_for_delivery'?'blue':'';return `<span class="chip ${cls}">${esc(s||'pending')}</span>`}
function orderCard(o){return `<div class="order"><div class="order-main"><div class="order-no">${esc(o.order_number||('Order #'+o.id))}</div><div class="order-meta">${esc(o.customer_name||'Customer')} · ${esc(o.customer_phone||'')} · ${new Date(o.created_at).toLocaleString()}</div><div class="order-meta">${money(o.total)} · ${esc(o.town_area||'')} · ${esc(o.payment_method||'')}</div></div><div class="chips">${statusChip(o.status)}<button class="btn soft" onclick="manageOrder(${o.id})">View / Manage</button></div></div>`}
async function orders(){const r=await sb.from('orders').select('*').order('created_at',{ascending:false});const list=r.data||[];$('content').innerHTML=`<div class="toolbar"><div class="muted">${list.length} orders</div><input id="orderSearch" placeholder="Search orders" style="padding:10px;border:1px solid var(--line);border-radius:10px"></div><div class="orders" id="orderList">${list.map(orderCard).join('')||'<div class="empty">No orders yet.</div>'}</div>`;$('orderSearch').oninput=e=>{const q=e.target.value.toLowerCase();$('orderList').innerHTML=list.filter(o=>JSON.stringify(o).toLowerCase().includes(q)).map(orderCard).join('')||'<div class="empty">No matching orders.</div>'}}
async function manageOrder(id){const r=await sb.from('orders').select('*').eq('id',id).single();const o=r.data;if(!o)return;const items=await sb.from('order_items').select('*').eq('order_id',id);modal(`<h2>Manage ${esc(o.order_number||'#'+o.id)}</h2><p class="muted">${esc(o.customer_name)} · ${esc(o.customer_phone)} · ${esc(o.delivery_address)} · ${esc(o.town_area)}</p><div class="chips" style="margin:12px 0">${statusChip(o.status)}<span class="chip">${money(o.total)}</span><span class="chip">${esc(o.payment_method)}</span></div><h3>Items</h3>${(items.data||[]).map(i=>`<div class="item" style="border:1px solid var(--line);padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><span>${esc(i.product_name)} × ${i.quantity}</span><b>${money(i.unit_price*i.quantity)}</b></div>`).join('')||'<p class="muted">No items attached.</p>'}<div class="field"><label>Order status</label><select id="orderStatus">${['pending','confirmed','processing','out_for_delivery','delivered','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="actions"><button class="btn primary" onclick="updateOrder(${id})">Save Changes</button><button class="btn ghost" onclick="closeModal()">Close</button></div>`)}
async function updateOrder(id){const status=$('orderStatus').value;const r=await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);closeModal();toast('Order updated');go(current)}
async function products(){const r=await sb.from('products').select('*').order('sort_order',{ascending:true});const list=r.data||[];$('content').innerHTML=`<div class="toolbar"><div class="muted">${list.length} products</div><button class="btn primary" onclick="productModal()">＋ Add Product</button></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Published</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.description||'')}</div></td><td>${money(p.price)}</td><td>${p.stock??0}</td><td>${p.published?'Yes':'No'}</td><td><div class="actions"><button class="btn soft" onclick="productModal(${p.id})">Edit</button><button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No products.</td></tr>'}</tbody></table></div>`}
async function productModal(id){let p={name:'',description:'',price:400,stock:0,low_stock_threshold:5,image_url:'',active:true,published:true,benefits:[],skin_types:[],fragrance:'',sort_order:999};if(id){const r=await sb.from('products').select('*').eq('id',id).single();p=r.data||p}modal(`<h2>${id?'Edit':'Add'} Product</h2><div class="field"><label>Name</label><input id="pn" value="${esc(p.name)}"></div><div class="field"><label>Price (KSh)</label><input id="pp" type="number" value="${p.price??400}"></div><div class="field"><label>Stock</label><input id="ps" type="number" value="${p.stock??0}"></div><div class="field"><label>Image URL / path</label><input id="pi" value="${esc(p.image_url||'')}"></div><div class="field"><label>Description</label><textarea id="pd">${esc(p.description||'')}</textarea></div><div class="field"><label>Benefits (comma separated)</label><input id="pb" value="${esc((p.benefits||[]).join(', '))}"></div><div class="field"><label>Fragrance</label><input id="pf" value="${esc(p.fragrance||'')}"></div><div class="field"><label>Published</label><select id="pub"><option value="true" ${p.published?'selected':''}>Yes</option><option value="false" ${!p.published?'selected':''}>No</option></select></div><div class="actions"><button class="btn primary" onclick="saveProduct(${id||'null'})">Save Product</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
async function saveProduct(id){const payload={name:$('pn').value.trim(),price:Number($('pp').value)||0,stock:Number($('ps').value)||0,image_url:$('pi').value.trim(),description:$('pd').value.trim(),benefits:$('pb').value.split(',').map(x=>x.trim()).filter(Boolean),fragrance:$('pf').value.trim(),published:$('pub').value==='true',active:true,updated_at:new Date().toISOString()};if(!payload.name)return toast('Product name is required');const r=id?await sb.from('products').update(payload).eq('id',id):await sb.from('products').insert({...payload,sort_order:999});if(r.error)return toast(r.error.message);closeModal();toast('Product saved');products()}
async function deleteProduct(id){if(!confirm('Delete this product?'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)return toast(r.error.message);toast('Product deleted');products()}
async function customers(){const r=await sb.from('profiles').select('*').order('created_at',{ascending:false});const list=r.data||[];$('content').innerHTML=`<div class="toolbar"><div class="muted">${list.length} customer accounts</div></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.full_name||'—')}</b></td><td>${esc(p.phone||'—')}</td><td>${esc(p.email||'—')}</td><td>${esc(p.role||'customer')}</td><td>${p.disabled?'Disabled':'Active'}</td><td><button class="btn soft" onclick="toggleCustomer('${p.id}',${!p.disabled})">${p.disabled?'Enable':'Disable'}</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No customers.</td></tr>'}</tbody></table></div>`}
async function toggleCustomer(id,disabled){const r=await sb.from('profiles').update({disabled}).eq('id',id);if(r.error)return toast(r.error.message);toast(disabled?'Customer disabled':'Customer enabled');customers()}
async function proofs(){const r=await sb.from('orders').select('*').not('payment_proof_path','is',null).order('payment_proof_uploaded_at',{ascending:false});const list=r.data||[];$('content').innerHTML=`<div class="notice">Payment proofs uploaded by customers appear here. Review them and mark the order proof as approved or rejected.</div><div class="orders section">${list.map(o=>`<div class="order"><div class="order-main"><div class="order-no">${esc(o.order_number||'#'+o.id)}</div><div class="order-meta">${esc(o.customer_name||'Customer')} · ${esc(o.payment_method||'')} · ${money(o.total)}</div><div class="order-meta">Uploaded: ${o.payment_proof_uploaded_at?new Date(o.payment_proof_uploaded_at).toLocaleString():'—'}</div><div class="muted" style="margin-top:7px">${esc(o.payment_proof_path)}</div></div><div class="actions"><button class="btn soft" onclick="reviewProof(${o.id},'approved')">Approve</button><button class="btn danger" onclick="reviewProof(${o.id},'rejected')">Reject</button></div></div>`).join('')||'<div class="card empty">No payment proofs awaiting review.</div>'}</div>`}
async function reviewProof(id,result){const r=await sb.from('orders').update({payment_proof_reviewed_at:new Date().toISOString(),payment_proof_note:result}).eq('id',id);if(r.error)return toast(r.error.message);toast('Payment proof '+result);proofs()}
async function getSetting(key,def){const r=await sb.from('site_settings').select('value').eq('key',key).maybeSingle();return r.data?.value||def}
async function setSetting(key,value){const s=await sb.auth.getSession();const r=await sb.from('site_settings').upsert({key,value,updated_by:s.data.session.user.id,updated_at:new Date().toISOString()},{onConflict:'key'});if(r.error)throw r.error}
async function cart(){const payment=await getSetting('payment',{methods:['mpesa','pay_on_delivery'],mpesa_numbers:['0722276879','0726562792']});const delivery=await getSetting('delivery',{origin:'Umoja, Nairobi',minimum_fee:150});$('content').innerHTML=`<div class="grid2"><div class="card"><h2>Cart</h2><div class="item"><span>Add to Cart</span><b>ON</b></div><div class="item"><span>Quantity controls</span><b>ON</b></div><div class="item"><span>Soap price</span><b>KSh 400</b></div><div class="field"><label>Minimum delivery fee</label><input id="minFee" type="number" value="${delivery.minimum_fee??150}"></div><button class="btn primary" onclick="saveCartSettings()">Save Cart & Delivery</button></div><div class="card"><h2>Checkout Payments</h2><div class="field"><label>Payment methods</label><input id="methods" value="${esc((payment.methods||[]).join(', '))}"></div><div class="field"><label>M-Pesa numbers</label><input id="mpesa" value="${esc((payment.mpesa_numbers||[]).join(', '))}"></div><div class="field"><label>Delivery origin</label><input id="origin" value="${esc(delivery.origin||'Umoja, Nairobi')}"></div><button class="btn primary" onclick="saveCartSettings()">Save Checkout Settings</button></div></div><div class="card section"><h2>Checkout behavior</h2><p class="muted">Customers must have their name, phone and delivery address before an order is created. Cart totals use the product prices stored in Products.</p></div>`}
async function saveCartSettings(){try{await setSetting('payment',{methods:$('methods').value.split(',').map(x=>x.trim()).filter(Boolean),mpesa_numbers:$('mpesa').value.split(',').map(x=>x.trim()).filter(Boolean)});await setSetting('delivery',{origin:$('origin').value.trim(),minimum_fee:Number($('minFee').value)||0});toast('Cart & checkout settings saved');cart()}catch(e){toast(e.message)}}

async function saveEditor(){

  const collectionItems=($('ed_collectionItems').value||'').split('|').map(x=>x.trim()).filter(Boolean);
  const rows=[0,1,2,3].map(i=>({label:$('ed_c'+i+'l').value.trim(),text:$('ed_c'+i+'t').value.trim(),href:$('ed_c'+i+'h').value.trim()}));
  const payload={
    nav:{brand:$('ed_brand').value.trim(),careText:$('ed_care').value.trim(),careLink:$('ed_careLink').value.trim(),accountText:$('ed_account').value.trim(),home:$('ed_navHome').value.trim(),benefits:$('ed_navBenefits').value.trim(),products:$('ed_navProducts').value.trim(),about:$('ed_navAbout').value.trim(),contact:$('ed_navContact').value.trim()},
    copy:{heroKicker:$('ed_heroKicker').value.trim(),heroTitle:$('ed_heroTitle').value.trim(),heroAccent:$('ed_heroAccent').value.trim(),heroText:$('ed_heroText').value.trim(),productsLabel:$('ed_prodLabel').value.trim(),productsTitle:$('ed_productsTitle').value.trim(),productsAccent:$('ed_productsAccent').value.trim(),swipe:$('ed_swipe').value.trim(),aboutLabel:$('ed_aboutLabel').value.trim(),aboutTitle:$('ed_aboutTitle').value.trim(),aboutAccent:$('ed_aboutAccent').value.trim(),aboutText:$('ed_aboutText').value.trim()},
    buttons:{heroCta:$('ed_heroCta').value.trim()},
    links:{hero:$('ed_heroLink').value.trim(),benefits:$('ed_benLink').value.trim()},
    benefitBridge:{label:$('ed_benLabel').value.trim(),title:$('ed_benTitle').value.trim(),accent:$('ed_benAccent').value.trim(),text:$('ed_benText').value.trim(),button:$('ed_benButton').value.trim()},
    features:[{title:$('ed_f1t').value.trim(),text:$('ed_f1x').value.trim()},{title:$('ed_f2t').value.trim(),text:$('ed_f2x').value.trim()},{title:$('ed_f3t').value.trim(),text:$('ed_f3x').value.trim()}],
    contact:{label:$('ed_contactLabel').value.trim(),title:$('ed_contactTitle').value.trim(),accent:$('ed_contactAccent').value.trim(),text:$('ed_contactText').value.trim(),rows,collection:{title:$('ed_collectionTitle').value.trim(),items:collectionItems}},
    subscribe:{label:$('ed_subLabel').value.trim(),title:$('ed_subTitle').value.trim(),accent:$('ed_subAccent').value.trim(),text:$('ed_subText').value.trim(),placeholder:$('ed_subPlaceholder').value.trim(),button:$('ed_subButton').value.trim()},
    footer:{brand:$('ed_footBrand').value.trim(),subtitle:$('ed_footSub').value.trim(),copyright:$('ed_copy').value.trim()},
    images:{logo:$('ed_imgLogo').value.trim(),hero:$('ed_imgHero').value.trim(),about:$('ed_imgAbout').value.trim(),ai:$('ed_imgAi').value.trim()},
    ai:{title:$('ed_aiTitle').value.trim(),subtitle:$('ed_aiSubtitle').value.trim(),greeting:$('ed_aiGreeting').value.trim(),quick,visible:$('ed_aiVisible').value},
    design:{theme:$('ed_theme').value,font:$('ed_font').value,radius:Number($('ed_radius').value)||14,spacingPx:Number($('ed_spacingPx').value)||72,green:$('ed_green').value.trim(),green2:$('ed_green2').value.trim(),bg:$('ed_bg').value.trim(),ink:$('ed_ink').value.trim(),animations:$('ed_anim').value,customCss:$('ed_css').value}
  };
  try{await setSetting('storefront',payload);toast('Website changes saved successfully');}catch(e){toast(e.message||'Could not save website changes')}
